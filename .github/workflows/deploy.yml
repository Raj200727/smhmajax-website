name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  # ─── STAGE 1: Deploy to Test ───
  deploy-test:
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://testsmhmajax.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to testsmhmajax.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.TEST_FTP_SERVER }}
          username: ${{ secrets.TEST_FTP_USERNAME }}
          password: ${{ secrets.TEST_FTP_PASSWORD }}
          server-dir: /
          local-dir: ./

  # ─── STAGE 2: Deploy to Production (requires approval) ───
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-test  # Won't start until test succeeds
    environment:
      name: production
      url: https://smhmajax.ca
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to smhmajax.ca
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          local-dir: ./